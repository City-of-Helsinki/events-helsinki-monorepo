# Continuous integration (CI) triggers cause a pipeline to run whenever you push
# an update to the specified branches or you push specified tags.
trigger:
  batch: true
  tags:
    include:
      - sports-helsinki-*

# Pull request (PR) triggers cause a pipeline to run whenever a pull request is
# opened with one of the specified target branches, or when updates are made to
# such a pull request.
#
# GitHub creates a new ref when a pull request is created. The ref points to a
# merge commit, which is the merged code between the source and target branches
# of the pull request.
#
# Opt out of pull request validation
pr: none

resources:
  repositories:
    # Azure DevOps repository
    - repository: liikunta-pipelines
      type: git
      # Azure DevOps project/repository
      name: liikunta/liikunta-pipelines

extends:
  # Filename in Azure DevOps Repository
  template: components/liikunta-ui/pipelines/liikunta-ui-release.yml@liikunta-pipelines
  # UI configuration lives in liikunta-pipelines/components/liikunta-ui/vars/.
  # parameters:
  #   Pass build and ConfigMap overrides here only when needed.
  #   buildArgs: # production overrides
  #     NEXT_PUBLIC_DEBUG: 1
  #   buildArgsStage: # staging overrides
  #     NEXT_PUBLIC_DEBUG: 1
  #   buildArgsTest: # testing overrides
  #     NEXT_PUBLIC_DEBUG: 1
  #   configMap: # production overrides
  #     DEBUG: 1
  #   configMapStage: # staging overrides
  #     DEBUG: 1
  #   configMapTest: # testing overrides
  #     DEBUG: 1
