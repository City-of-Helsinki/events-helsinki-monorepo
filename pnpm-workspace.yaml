packages:
  - 'apps/*'
  - 'packages/*'
  - 'proxies/*'

# Only install package versions published at least 7 days ago (City of Helsinki org default)
minimumReleaseAge: 10080

# Force secure / single versions for transitive deps that otherwise resolve
# vulnerable or mismatched releases.
overrides:
  '@babel/core': ^7.29.6
  '@babel/runtime': ^7.28.4
  '@testing-library/dom': ^10.4.0
  '@tootallnate/once': ^3.0.1
  '@types/node': 24.13.2
  '@types/react': 18.3.1
  '@types/react-dom': 18.3.1
  cookie: 0.7.2
  eslint: 9.39.4
  form-data: ^4.0.4
  get-func-name: 2.0.2
  # immutable@3 has no 3.x security fix; force 4.3.9 for GHSA-v56q / GHSA-xvcm
  immutable@^3.0.0: 4.3.9
  immutable@^5.0.0: 5.1.9
  jose: 4.15.9
  lodash: 4.18.1
  minimatch@9.0.3: ^9.0.6
  minimatch@10.1.2: ^10.2.3
  path-to-regexp: ^8.4.0
  qs: 6.15.2
  react: 18.3.1
  react-dom: 18.3.1
  rollup@4.35.0: ^4.59.0
  serialize-javascript: ^7.0.5
  socks: ^2.8.6
  svgo@^3.0.2: ^4.0.2
  tar: '>=7.5.4'
  tmp: 0.2.7
  underscore: '>=1.13.8'
  typescript: 5.8.3
  ws: ^8.21.0
  js-yaml: 4.3.1
  i18next-fs-backend: 2.6.6
  '@opentelemetry/core': ^2.8.0
  '@opentelemetry/sdk-trace-base': ^2.8.0
  '@opentelemetry/resources': ^2.8.0
  'yaml@^2.0.0': ^2.8.3
  postcss: ^8.5.23
  'nanoid@^3.0.0': 3.3.17
  fast-uri: 3.1.5
  sharp: 0.35.3
  dompurify: 3.4.13
  'brace-expansion@1': 1.1.18
  'brace-expansion@2': 2.1.4
  'brace-expansion@5': 5.0.9
  'uuid@11.1.0': 11.1.1
  'uuid@^9.0.0': 11.1.1
  diff: 4.0.4
  esbuild: 0.28.1
  shell-quote: 1.10.0

allowBuilds:
  '@apollo/protobufjs': true
  '@ffmpeg-installer/darwin-arm64': true
  '@ffmpeg-installer/linux-arm64': true
  '@ffmpeg-installer/linux-x64': true
  '@parcel/watcher': true
  '@sentry/cli': true
  core-js: true
  core-js-pure: true
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true
