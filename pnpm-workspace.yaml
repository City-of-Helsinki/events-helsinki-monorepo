packages:
  - 'apps/*'
  - 'packages/*'
  - 'proxies/*'

# Only install package versions published at least 7 days ago (City of Helsinki org default)
minimumReleaseAge: 10080

# Force secure / single versions for transitive deps that otherwise resolve
# vulnerable or mismatched releases.
overrides:
  # With the 2.x sanitizer's jsdom, Turbopack dev SSR fails with ENOENT on jsdom's default-stylesheet.css.
  '@city-of-helsinki/react-helsinki-headless-cms>isomorphic-dompurify': 4.7.0
  '@babel/core': ^7.29.6
  '@babel/runtime': ^7.28.4
  '@graphql-tools/utils': ^12.0.3
  '@testing-library/dom': ^10.4.0
  '@types/node': 24.19.2
  '@types/react': 19.2.17
  '@types/react-dom': 19.2.3
  cookie: 0.7.2
  eslint: 9.39.4
  # immutable@3 has no 3.x security fix; force 4.3.9 for GHSA-v56q / GHSA-xvcm
  immutable@^3.0.0: 4.3.9
  lodash: 4.18.1
  minimatch@10.1.2: ^10.2.3
  path-to-regexp: ^8.4.0
  qs: 6.16.1
  react: 19.2.7
  react-dom: 19.2.7
  rollup@4.35.0: ^4.59.0
  svgo@^3.0.2: ^4.1.0
  tmp: 0.2.7
  underscore: '>=1.13.8'
  typescript: 5.8.3
  ws: ^8.21.0
  '@opentelemetry/core': ^2.8.0
  '@opentelemetry/sdk-trace-base': ^2.8.0
  'yaml@^2.0.0': ^2.8.3
  postcss: ^8.5.23
  'uuid@^9.0.0': 11.1.1
  diff: 4.0.4
  esbuild: 0.28.1

allowBuilds:
  '@apollo/protobufjs': true
  '@ffmpeg-installer/darwin-arm64': true
  '@ffmpeg-installer/linux-arm64': true
  '@ffmpeg-installer/linux-x64': true
  '@parcel/watcher': true
  '@sentry/cli': true
  core-js: true
  core-js-pure: true
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - body-parser@2.4.0
